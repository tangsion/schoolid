<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* 页面背景 */
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 登录卡片容器 */
        .login-container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 标题样式 */
        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }

        /* 表单组样式 */
        .form-group {
            margin-bottom: 20px;
        }

        /* 标签样式 */
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        /* 输入框样式 */
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        /* 输入框聚焦效果 */
        .form-control:focus {
            outline: none;
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
        }

        /* 错误提示样式 */
        .error-message {
            color: #f56c6c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        /* 登录按钮样式 */
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        /* 按钮hover效果 */
        .login-btn:hover {
            background-color: #337ecc;
        }

        /* 底部链接 */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .login-footer a {
            color: #409eff;
            text-decoration: none;
            margin: 0 8px;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">用户登录</h2>
        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名/手机号</label>
                <input type="text" id="username" class="form-control" placeholder="请输入用户名或手机号">
                <div class="error-message" id="usernameError">请输入有效的用户名或手机号</div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" class="form-control" placeholder="请输入密码">
                <div class="error-message" id="passwordError">密码长度不能少于6位</div>
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>
        <div class="login-footer">
            <a href="#">忘记密码？</a>
            <a href="#">注册账号</a>
        </div>
    </div>

    <script>
        // 获取表单和元素
        const loginForm = document.getElementById('loginForm');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');

        // 表单提交事件
        loginForm.addEventListener('submit', function(e) {
            // 阻止表单默认提交行为
            e.preventDefault();
            
            // 标记是否验证通过
            let isValid = true;

            // 验证用户名
            if (!username.value.trim()) {
                usernameError.style.display = 'block';
                isValid = false;
            } else {
                usernameError.style.display = 'none';
            }

            // 验证密码
            if (password.value.length < 6) {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }

            // 验证通过后的操作（实际项目中这里会对接后端接口）
            if (isValid) {
             
loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const res = await fetch("http://1.12.52.229:5000/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    const data = await res.json();

    if (data.code === 0) {
        alert("登录成功");
    } else {
        alert(data.msg);
    }
});


            }
        });

        // 输入框输入时隐藏错误提示
        username.addEventListener('input', function() {
            usernameError.style.display = 'none';
        });

        password.addEventListener('input', function() {
            passwordError.style.display = 'none';
        });
    </script>
</body>
</html>
